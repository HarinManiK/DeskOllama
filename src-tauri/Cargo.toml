[package]
name = "DeskOllama"
version = "1.0.0"
description = "DeskOllama Desktop Application"
authors = ["DeskOllama"]
edition = "2021"

[lib]
name = "DeskOllama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DeskOllama"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
